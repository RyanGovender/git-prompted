name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4   # pin to a commit SHA before publishing
      - uses: actions/setup-go@v5   # pin to a commit SHA before publishing
        with:
          go-version-file: go.mod
      - run: make test
      - run: make check
        if: runner.os == 'Linux'
