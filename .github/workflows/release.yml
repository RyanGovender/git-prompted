name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pin to a commit SHA before publishing
      - uses: actions/setup-go@v5   # pin to a commit SHA before publishing
        with:
          go-version-file: go.mod
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: make test check
      - run: make dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
